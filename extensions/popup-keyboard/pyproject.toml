[project]
name = "popup-keyboard"
version = "0.1.1"
description = "Focus-scoped Flet popup keyboard compatibility"
requires-python = ">=3.13"
dependencies = ["flet==1.1.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"flutter.popup_keyboard" = ["pubspec.yaml", "lib/**"]
