[project]
name = "finance-saf"
version = "0.1.0"
description = "Minimal Flet bridge to Android SAF for TextMoney"
requires-python = ">=3.13"
dependencies = ["flet==1.0.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"flutter.finance_saf" = ["pubspec.yaml", "lib/**"]
