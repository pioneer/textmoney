[project]
name = "browser-history-bridge"
version = "0.1.0"
description = "Flet browser history back service"
requires-python = ">=3.13"
dependencies = ["flet==1.1.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"flutter.browser_history_bridge" = ["pubspec.yaml", "lib/**"]
