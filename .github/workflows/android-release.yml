name: Android production release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: android-production
    permissions:
      contents: write
    env:
      FLET_CLI_NO_RICH_OUTPUT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check project and release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run inv check
          uv run inv validate-android-release --tag "$GITHUB_REF_NAME"
      - name: Materialize protected keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
      - name: Build and verify signed APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/android-release.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: android-release
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: uv run inv build-android-release --tag "$GITHUB_REF_NAME"
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="build/apk/txncount-${GITHUB_REF_NAME#v}.apk"
          test -s "$apk_path"
          gh release create "$GITHUB_REF_NAME" "$apk_path" \
            --title "TxnCount $GITHUB_REF_NAME" \
            --generate-notes
