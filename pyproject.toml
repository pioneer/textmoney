[project]
name = "textmoney"
version = "0.4.23"
description = "TextMoney: offline-first personal expense tracking"
requires-python = ">=3.13"
dependencies = [
    "flet==1.1.2",
    "flet-secure-storage==1.1.2",
    "httpx>=0.28.1,<0.29",
    "finance-saf==0.1.0",
    "notification-bridge==0.1.0",
    "browser-history-bridge==0.1.0",
    "popup-keyboard==0.1.1",
    "beancount-parser==1.2.3",
    "autobean-refactor==0.3.1",
    "lark==1.3.1",
    "tzdata>=2026.2,<2027",
    "babel>=2.16,<3",
    "pillow>=11,<13",
]

[tool.uv.sources]
finance-saf = { path = "extensions/finance-saf" }
notification-bridge = { path = "extensions/notification-bridge" }
browser-history-bridge = { path = "extensions/browser-history-bridge" }
popup-keyboard = { path = "extensions/popup-keyboard" }

[dependency-groups]
dev = [
    "flet[all]==1.1.2",
    "flet-mcp==1.1.2",
    "invoke>=2.2,<3",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "pyright>=1.1.400,<2",
    "beancount==3.2.3",
    "pip>=25,<27",
    "fava==1.30.16",
    "Babel>=2.16,<3",
    "pytest-timeout>=2,<3",
    "playwright>=1.56,<2",
    "telethon>=1.40,<2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist", "src/assets", "src/.flet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "tasks.py", "tools", "extensions/finance-saf/src/finance_saf", "extensions/notification-bridge/src/notification_bridge", "extensions/browser-history-bridge/src/browser_history_bridge", "extensions/popup-keyboard/src/popup_keyboard"]
exclude = ["src/assets", "src/.flet", "**/__pycache__"]
extraPaths = ["src", "."]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
timeout = 120

[tool.flet]
product = "TextMoney"
org = "com.pioneer"
bundle_id = "com.pioneer.textmoney"
company = "Pioneer"
build_number = 72
icon_background = "#ffffff"

[tool.textmoney.android_release]
certificate_sha256 = "0C:C0:3E:95:37:EF:04:1C:51:EB:8E:CE:CA:1A:E9:E2:46:C7:E5:A2:C8:14:FF:1D:D9:A7:F1:9A:B6:C0:7F:A6"
signing_alias = "android-release"

[tool.flet.dev_packages]
finance-saf = "extensions/finance-saf"
notification-bridge = "extensions/notification-bridge"
browser-history-bridge = "extensions/browser-history-bridge"
popup-keyboard = "extensions/popup-keyboard"

[tool.flet.android]
res_dir = "platform/android/res"
adaptive_icon_background = "#E0F8EF"
# Parsers and Babel open grammar/locale data using real __file__-relative paths.
extract_packages = ["autobean_refactor", "beancount_parser", "lark", "babel"]

[tool.flet.android.manifest_application]
fullBackupContent = "@xml/textmoney_backup"
dataExtractionRules = "@xml/textmoney_data_extraction"

[tool.flet.flutter.pubspec.dependency_overrides]
# JNI 1.2.0 crashes on Android; jni_flutter 1.1.0 requires that broken release.
jni = "1.1.2"
jni_flutter = "1.0.4+1"

[tool.flet.app]
path = "src"
module = "main"
exclude = ["__pycache__", ".flet"]

[tool.flet.web]
route_url_strategy = "hash"

[tool.flet.compile]
app = true

[tool.flet.cleanup]
app = false
