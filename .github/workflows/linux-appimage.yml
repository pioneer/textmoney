name: Linux AppImage

on:
  workflow_run:
    workflows: ["Android production release"]
    types: [completed]
    branches: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FLET_CLI_NO_RICH_OUTPUT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install Flet and AppImage build dependencies
        run: |
          mapfile -t flet_packages < <(uv run flet --version --json | jq -r '.linux_dependencies[]')
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "${flet_packages[@]}" \
            desktop-file-utils file libgirepository1.0-dev librsvg2-dev \
            squashfs-tools xvfb
      - name: Select and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            tag="$EVENT_TAG"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(uv run python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"])')"
          test "$tag" = "v$version"
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - name: Run project checks
        run: uv run inv check
      - name: Build AppImage
        run: uv run inv build-linux-appimage
      - name: Validate AppImage structure
        run: uv run inv validate-linux-appimage
      - name: Smoke test AppImage startup
        run: uv run inv smoke-linux-appimage
      - uses: actions/upload-artifact@v7
        with:
          name: txncount-linux-appimage-${{ steps.release.outputs.version }}
          path: dist/linux/TxnCount-${{ steps.release.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY"
      - name: Upload AppImage without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "dist/linux/TxnCount-${{ steps.release.outputs.version }}-x86_64.AppImage" \
            --repo "$GITHUB_REPOSITORY"
